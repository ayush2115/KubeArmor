name: ci-trivy-scan

on:
  push: 
    branches:
      - "main"
      - "v*"
    paths:
      - "KubeArmor/**"
      - "protobuf/**"
      - ".github/workflows/ci-trivy-scan.yaml"
      - "pkg/**"
      - "!STABLE-RELEASE"

  create:
    branches:
      - "v*"

permissions: read-all

jobs:
  build:
    name: Run trivy scan
    if: github.repository == 'ayush2115/kubearmor'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    timeout-minutes: 150
    outputs:
      vulnerable: ${{ steps.summary.outputs.vulnerable }}
      failed_components: ${{ steps.summary.outputs.failed_components }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'KubeArmor/go.mod'
      
      - name: Filter changed paths
        uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50 # v2
        id: filter
        with:
          filters: |
            kubearmor:
              - "KubeArmor/**"
              - "protobuf/**"
            controller:
              - 'pkg/KubeArmorController/**'
            operator:
              - 'pkg/KubeArmorOperator/**'
      
      # FORK VALIDATION ONLY -- the real workflow builds the KubeArmor images
      # here. The fork has no self-hosted runner and main was just de-vulned by
      # #2853, so stand-in images with known fixed CRITICAL/HIGH CVEs are used
      # instead. debian:11-slim is clean on purpose, to show a passing component.
      - name: Pull stand-in images and save them to tar
        run: |
          set -eux
          docker pull node:18.0.0-slim
          docker pull python:3.9.0-slim
          docker pull debian:11-slim

          docker save -o kubearmor-init.tar node:18.0.0-slim
          docker save -o kubearmor.tar python:3.9.0-slim
          if [[ ${{ steps.filter.outputs.operator }} == 'true' ]]; then
            docker save -o kubearmor-operator.tar node:18.0.0-slim
          fi
          if [[ ${{ steps.filter.outputs.controller }} == 'true' ]]; then
            docker save -o kubearmor-controller.tar debian:11-slim
          fi

      - name: Prepare Trivy report directory
        run: mkdir -p trivy-reports

      - name: Run Trivy vulnerability scanner on kubearmor-init
        id: scan_init
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: kubearmor-init.tar
          format: 'table'
          output: 'trivy-reports/kubearmor-init.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true 

      - name: Run Trivy vulnerability scanner on kubearmor
        id: scan_main
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: kubearmor.tar
          format: 'table'
          output: 'trivy-reports/kubearmor.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'   
        continue-on-error: true  

      - name: Run Trivy vulnerability scanner on kubearmor-controller
        if: steps.filter.outputs.controller == 'true'
        id: scan_controller
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: kubearmor-controller.tar
          format: 'table'
          output: 'trivy-reports/kubearmor-controller.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'   
        continue-on-error: true 

      - name: Run Trivy vulnerability scanner on kubearmor-operator
        if: steps.filter.outputs.operator == 'true'
        id: scan_operator
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: kubearmor-operator.tar
          format: 'table'
          output: 'trivy-reports/kubearmor-operator.txt'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'   
        continue-on-error: true 


      - name: Summarize Trivy scan results
        id: summary
        env:
          TRIVY_COMPONENTS: |
            kubearmor-init|kubearmor/kubearmor-init:latest|${{ steps.scan_init.outcome }}|true
            kubearmor|kubearmor/kubearmor:latest|${{ steps.scan_main.outcome }}|true
            kubearmor-controller|kubearmor/kubearmor-controller:latest|${{ steps.scan_controller.outcome }}|${{ steps.filter.outputs.controller }}
            kubearmor-operator|kubearmor/kubearmor-operator:latest|${{ steps.scan_operator.outcome }}|${{ steps.filter.outputs.operator }}
        run: ./.github/workflows/trivy-summarize.sh

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-reports
          path: trivy-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if vulnerabilities were found
        if: steps.summary.outputs.vulnerable == 'true'
        env:
          FAILED_COMPONENTS: ${{ steps.summary.outputs.failed_components }}
        run: |
          echo "Trivy reported vulnerabilities in: $FAILED_COMPONENTS"
          exit 1

  report-vulnerabilities:
    name: Track Trivy findings
    needs: build
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.vulnerable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Trivy reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: trivy-reports
          path: trivy-reports

      - name: Create or update the Trivy tracking issue
        run: ./.github/workflows/trivy-report-issue.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TRIVY_ISSUE_TITLE: "[Trivy] Vulnerabilities detected in KubeArmor images on main"
          TRIVY_ARTIFACT_NAME: trivy-reports
          TRIVY_REPORT_DIR: trivy-reports
          TRIVY_LABELS: security,trivy
          TRIVY_SEVERITY: CRITICAL,HIGH

# fork validation run 2: issues enabled, expect a new tracking issue
