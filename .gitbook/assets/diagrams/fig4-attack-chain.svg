<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" width="960" height="296" role="img" aria-label="Every recent container attack walks the same four steps: get in, run a payload, steal secrets, then spread or exfiltrate. KubeArmor policy cuts three of them. An allow-list stops the payload, denied reads on secret paths stop the theft, and denied egress stops the spread.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="currentColor"/>
    </marker>
    <g id="ic-deny" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="9" cy="9" r="6.6"/><path d="M4.4 13.6L13.6 4.4"/>
    </g>
  </defs>

  <rect x="0" y="0" width="960" height="296" fill="#FFFFFF"/>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

    <text x="30" y="34" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#7A868C">THE SAME FOUR STEPS, EVERY TIME</text>

    <!-- steps -->
    <rect x="30" y="50" width="196" height="54" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <text x="128" y="74" font-size="13" font-weight="650" fill="#14181C" text-anchor="middle">1. Get in</text>
    <text x="128" y="92" font-size="11.5" fill="#7A868C" text-anchor="middle">an RCE, or a bad package</text>

    <rect x="266" y="50" width="196" height="54" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <text x="364" y="74" font-size="13" font-weight="650" fill="#14181C" text-anchor="middle">2. Run a payload</text>
    <text x="364" y="92" font-size="11.5" fill="#7A868C" text-anchor="middle">a shell, a miner, a scanner</text>

    <rect x="502" y="50" width="196" height="54" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <text x="600" y="74" font-size="13" font-weight="650" fill="#14181C" text-anchor="middle">3. Steal secrets</text>
    <text x="600" y="92" font-size="11.5" fill="#7A868C" text-anchor="middle">tokens, cloud keys</text>

    <rect x="738" y="50" width="192" height="54" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <text x="834" y="74" font-size="13" font-weight="650" fill="#14181C" text-anchor="middle">4. Spread, exfiltrate</text>
    <text x="834" y="92" font-size="11.5" fill="#7A868C" text-anchor="middle">C2, a public repo</text>

    <g color="#4A555B" stroke="#4A555B" stroke-width="1.6" fill="none">
      <line x1="226" y1="77" x2="266" y2="77" marker-end="url(#arw)"/>
      <line x1="462" y1="77" x2="502" y2="77" marker-end="url(#arw)"/>
      <line x1="698" y1="77" x2="738" y2="77" marker-end="url(#arw)"/>
    </g>

    <!-- cuts -->
    <g stroke="#B23A0B" stroke-width="2.4">
      <line x1="246" y1="42" x2="246" y2="120"/>
      <line x1="482" y1="42" x2="482" y2="120"/>
      <line x1="718" y1="42" x2="718" y2="120"/>
    </g>
    <g color="#B23A0B">
      <use href="#ic-deny" x="237" y="124"/>
      <use href="#ic-deny" x="473" y="124"/>
      <use href="#ic-deny" x="709" y="124"/>
    </g>

    <!-- policies -->
    <rect x="266" y="164" width="196" height="70" rx="5" fill="#FDF3ED" stroke="#B23A0B" stroke-width="1.6"/>
    <text x="364" y="188" font-size="12.5" font-weight="650" fill="#B23A0B" text-anchor="middle">Allow-list the process</text>
    <text x="364" y="208" font-size="11.5" fill="#4A555B" text-anchor="middle">Only listed binaries run.</text>
    <text x="364" y="224" font-size="11.5" fill="#4A555B" text-anchor="middle">The payload never starts.</text>

    <rect x="502" y="164" width="196" height="70" rx="5" fill="#FDF3ED" stroke="#B23A0B" stroke-width="1.6"/>
    <text x="600" y="188" font-size="12.5" font-weight="650" fill="#B23A0B" text-anchor="middle">Deny secret paths</text>
    <text x="600" y="208" font-size="11.5" fill="#4A555B" text-anchor="middle">The token read returns</text>
    <text x="600" y="224" font-size="11.5" fill="#4A555B" text-anchor="middle">Permission denied.</text>

    <rect x="738" y="164" width="192" height="70" rx="5" fill="#FDF3ED" stroke="#B23A0B" stroke-width="1.6"/>
    <text x="834" y="188" font-size="12.5" font-weight="650" fill="#B23A0B" text-anchor="middle">Deny unlisted egress</text>
    <text x="834" y="208" font-size="11.5" fill="#4A555B" text-anchor="middle">No raw sockets, no</text>
    <text x="834" y="224" font-size="11.5" fill="#4A555B" text-anchor="middle">traffic to the attacker.</text>

    <g stroke="#B23A0B" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
      <polyline points="246,148 246,156 364,156 364,164"/>
      <polyline points="482,148 482,156 600,156 600,164"/>
      <polyline points="718,148 718,156 834,156 834,164"/>
    </g>

    <text x="30" y="270" font-size="12.5" font-weight="650" fill="#B23A0B">Cut any one of these steps and the attack stops here.</text>
    <text x="30" y="288" font-size="12" fill="#4A555B">The table below walks five published 2025 campaigns through these same steps.</text>
  </g>
</svg>
