<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-label="Three steps. You write a Kubernetes policy. KubeArmor runs one pod per node and turns that policy into kernel rules. The Linux kernel checks every exec, file and network call at an LSM hook. Allowed calls proceed, blocked calls return Permission denied, and a copy of each event goes out as logs and alerts.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="currentColor"/>
    </marker>
    <g id="ic-policy" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M3.5 1.8h7.2l4 4v10.4H3.5z"/><path d="M10.7 1.8v4h4"/><path d="M6.2 9.8h6.2M6.2 12.6h6.2"/>
    </g>
    <g id="ic-shield" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <path d="M9 1.8l6 2.2v5c0 4-2.6 6.6-6 7.8-3.4-1.2-6-3.8-6-7.8v-5z"/><path d="M6.3 9.2l2 2 3.4-3.6"/>
    </g>
    <g id="ic-chip" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="4.6" y="4.6" width="8.8" height="8.8" rx="1"/>
      <path d="M7.4 1.6v3M10.6 1.6v3M7.4 13.4v3M10.6 13.4v3M1.6 7.4h3M1.6 10.6h3M13.4 7.4h3M13.4 10.6h3"/>
    </g>
    <g id="ic-check" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="9" r="6.6"/><path d="M5.6 9.2l2.4 2.4 4.4-4.8"/>
    </g>
    <g id="ic-deny" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="9" cy="9" r="6.6"/><path d="M4.4 13.6L13.6 4.4"/>
    </g>
    <g id="ic-stream" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M2.5 5.5h13M2.5 9h13M2.5 12.5h9"/><circle cx="14.6" cy="12.5" r="1.4"/>
    </g>
  </defs>

  <rect x="0" y="0" width="960" height="356" fill="#FFFFFF"/>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

    <!-- step 1 -->
    <rect x="30" y="46" width="256" height="86" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <g color="#35617A"><use href="#ic-policy" x="48" y="64"/></g>
    <text x="76" y="78" font-size="14" font-weight="650" fill="#14181C">1. You write a policy</text>
    <text x="48" y="103" font-size="12" fill="#4A555B">Plain Kubernetes YAML. Allow these</text>
    <text x="48" y="120" font-size="12" fill="#4A555B">actions, deny or audit the rest.</text>

    <!-- step 2 -->
    <rect x="346" y="46" width="256" height="86" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <g color="#35617A"><use href="#ic-shield" x="364" y="64"/></g>
    <text x="392" y="78" font-size="14" font-weight="650" fill="#14181C">2. KubeArmor runs</text>
    <text x="364" y="103" font-size="12" fill="#4A555B">One non-privileged pod per node.</text>
    <text x="364" y="120" font-size="12" fill="#4A555B">It turns policy into kernel rules.</text>

    <!-- step 3 -->
    <rect x="662" y="46" width="268" height="86" rx="5" fill="#FDF3ED" stroke="#B23A0B" stroke-width="2"/>
    <g color="#B23A0B"><use href="#ic-chip" x="680" y="64"/></g>
    <text x="708" y="78" font-size="14" font-weight="650" fill="#14181C">3. The kernel decides</text>
    <text x="680" y="103" font-size="12" fill="#4A555B">An LSM hook checks every exec, file</text>
    <text x="680" y="120" font-size="12" fill="#4A555B">and network call as it is made.</text>

    <g color="#4A555B" stroke="#4A555B" stroke-width="1.6" fill="none">
      <line x1="286" y1="89" x2="346" y2="89" marker-end="url(#arw)"/>
      <line x1="602" y1="89" x2="662" y2="89" marker-end="url(#arw)"/>
    </g>

    <!-- outcomes -->
    <rect x="662" y="196" width="128" height="62" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <g color="#2F5A72"><use href="#ic-check" x="678" y="212"/></g>
    <text x="706" y="226" font-size="12.5" font-weight="650" fill="#14181C">Allowed</text>
    <text x="678" y="247" font-size="11.5" fill="#4A555B">the call proceeds</text>

    <rect x="802" y="196" width="128" height="62" rx="5" fill="#FDF3ED" stroke="#B23A0B" stroke-width="1.6"/>
    <g color="#B23A0B"><use href="#ic-deny" x="818" y="212"/></g>
    <text x="846" y="226" font-size="12.5" font-weight="650" fill="#14181C">Blocked</text>
    <text x="818" y="247" font-size="11.5" fill="#4A555B">Permission denied</text>

    <g color="#B23A0B" stroke="#B23A0B" stroke-width="2" fill="none">
      <polyline points="796,132 726,168 726,196" marker-end="url(#arw)"/>
      <polyline points="796,132 866,168 866,196" marker-end="url(#arw)"/>
    </g>

    <!-- telemetry -->
    <rect x="346" y="196" width="256" height="62" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <g color="#2F5A72"><use href="#ic-stream" x="364" y="212"/></g>
    <text x="392" y="226" font-size="12.5" font-weight="650" fill="#14181C">Logs and alerts</text>
    <text x="364" y="247" font-size="11.5" fill="#4A555B">karmor CLI, Prometheus, OpenTelemetry</text>

    <g color="#2F5A72" stroke="#2F5A72" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
      <line x1="474" y1="132" x2="474" y2="196" marker-end="url(#arw)"/>
    </g>
    <text x="484" y="170" font-size="11.5" fill="#2F5A72">a copy of each event</text>

    <!-- the point -->
    <line x1="30" y1="292" x2="930" y2="292" stroke="#D8DFDC" stroke-width="1"/>
    <text x="30" y="318" font-size="13" font-weight="650" fill="#B23A0B">The decision happens in the kernel, before the action completes.</text>
    <text x="30" y="338" font-size="12" fill="#4A555B">Nothing runs first. No node changes, no container runtime swap, and a dropped log line never weakens enforcement.</text>
  </g>
</svg>
