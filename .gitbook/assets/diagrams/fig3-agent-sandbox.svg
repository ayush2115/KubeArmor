<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="An AI agent in a sandboxed pod. Policy allows the app process and its own files. Policy denies a shell or scanner, credentials and tokens, unlisted network egress, and writing then running a script in slash tmp.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="currentColor"/>
    </marker>
    <g id="ic-robot" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <rect x="3" y="6" width="12" height="9.4" rx="2.2"/><path d="M9 3.4v2.6"/><circle cx="9" cy="2.3" r="1.1"/>
      <circle cx="6.6" cy="10.4" r="1"/><circle cx="11.4" cy="10.4" r="1"/>
    </g>
    <g id="ic-check" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="9" r="6.6"/><path d="M5.6 9.2l2.4 2.4 4.4-4.8"/>
    </g>
    <g id="ic-deny" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="9" cy="9" r="6.6"/><path d="M4.4 13.6L13.6 4.4"/>
    </g>
  </defs>

  <rect x="0" y="0" width="960" height="320" fill="#FFFFFF"/>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

    <!-- agent -->
    <rect x="30" y="112" width="232" height="86" rx="5" fill="#FDF3ED" stroke="#B23A0B" stroke-width="2"/>
    <g color="#B23A0B"><use href="#ic-robot" x="48" y="130"/></g>
    <text x="76" y="144" font-size="14" font-weight="650" fill="#14181C">The agent</text>
    <text x="48" y="169" font-size="12" fill="#4A555B">An LLM agent, an MCP server or</text>
    <text x="48" y="186" font-size="12" fill="#4A555B">a model. All of them are processes.</text>

    <!-- gate -->
    <rect x="330" y="42" width="14" height="232" rx="3" fill="#FDF3ED" stroke="#B23A0B" stroke-width="1.8"/>
    <text x="337" y="32" text-anchor="middle" font-size="12.5" font-weight="650" fill="#B23A0B">KubeArmor policy</text>
    <text x="337" y="294" text-anchor="middle" font-size="11.5" fill="#4A555B">deny by default, enforced in the kernel</text>

    <g color="#4A555B" stroke="#4A555B" stroke-width="1.6" fill="none">
      <line x1="262" y1="155" x2="330" y2="155" marker-end="url(#arw)"/>
    </g>

    <!-- allowed -->
    <rect x="420" y="52" width="510" height="46" rx="5" fill="#F0F5F7" stroke="#2F5A72" stroke-width="1.8"/>
    <g color="#2F5A72"><use href="#ic-check" x="438" y="66"/></g>
    <text x="466" y="80" font-size="13" font-weight="600" fill="#14181C">Run the app process, read its own files</text>
    <text x="912" y="80" font-size="12" font-weight="650" fill="#2F5A72" text-anchor="end">allowed</text>

    <!-- denied -->
    <rect x="420" y="110" width="510" height="46" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <g color="#B23A0B"><use href="#ic-deny" x="438" y="124"/></g>
    <text x="466" y="138" font-size="13" font-weight="600" fill="#14181C">Spawn a shell, curl, nmap, apk add</text>
    <text x="912" y="138" font-size="12" fill="#7A868C" text-anchor="end">prompt injection</text>

    <rect x="420" y="168" width="510" height="46" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <g color="#B23A0B"><use href="#ic-deny" x="438" y="182"/></g>
    <text x="466" y="196" font-size="13" font-weight="600" fill="#14181C">Read credentials and tokens</text>
    <text x="912" y="196" font-size="12" fill="#7A868C" text-anchor="end">credential theft</text>

    <rect x="420" y="226" width="510" height="46" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <g color="#B23A0B"><use href="#ic-deny" x="438" y="240"/></g>
    <text x="466" y="254" font-size="13" font-weight="600" fill="#14181C">Open a socket, or write and run /tmp/script</text>
    <text x="912" y="254" font-size="12" fill="#7A868C" text-anchor="end">reverse shell</text>
  </g>
</svg>
