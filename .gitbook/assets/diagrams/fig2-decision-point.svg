<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" width="960" height="306" role="img" aria-label="Two ways to handle the same syscall. Detect and respond lets the action run, ships the event to userspace, then sends a kill signal, by which time the damage is done. KubeArmor checks the rule at an LSM hook inside the same syscall, which returns Permission denied, so nothing ran.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="currentColor"/>
    </marker>
    <g id="ic-clock" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="9" cy="9" r="6.8"/><path d="M9 4.8V9l3 2"/>
    </g>
    <g id="ic-lock" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <rect x="3.4" y="7.8" width="11.2" height="7.8" rx="1.4"/><path d="M6.2 7.8V5.8a2.8 2.8 0 0 1 5.6 0v2"/>
    </g>
  </defs>

  <rect x="0" y="0" width="960" height="306" fill="#FFFFFF"/>

  <g font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif">

    <!-- detect and respond -->
    <text x="30" y="34" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#7A868C">DETECT AND RESPOND</text>

    <rect x="30" y="50" width="212" height="52" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <text x="136" y="82" font-size="13" font-weight="600" fill="#14181C" text-anchor="middle">the action runs</text>

    <rect x="288" y="50" width="212" height="52" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <text x="394" y="82" font-size="13" font-weight="600" fill="#14181C" text-anchor="middle">event ships to userspace</text>

    <rect x="546" y="50" width="176" height="52" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <text x="634" y="82" font-size="13" font-weight="600" fill="#14181C" text-anchor="middle">kill signal sent</text>

    <rect x="768" y="50" width="162" height="52" rx="5" fill="#FDF3ED" stroke="#B23A0B" stroke-width="1.8"/>
    <text x="849" y="82" font-size="13" font-weight="650" fill="#B23A0B" text-anchor="middle">too late</text>

    <g color="#4A555B" stroke="#4A555B" stroke-width="1.6" fill="none">
      <line x1="242" y1="76" x2="288" y2="76" marker-end="url(#arw)"/>
      <line x1="500" y1="76" x2="546" y2="76" marker-end="url(#arw)"/>
      <line x1="722" y1="76" x2="768" y2="76" marker-end="url(#arw)"/>
    </g>

    <g color="#B23A0B"><use href="#ic-clock" x="127" y="118"/></g>
    <text x="156" y="132" font-size="12" fill="#4A555B">milliseconds to minutes pass. The file is already read, moved or deleted.</text>

    <line x1="30" y1="168" x2="930" y2="168" stroke="#D8DFDC" stroke-width="1"/>

    <!-- inline -->
    <text x="30" y="198" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.4" fill="#B23A0B">KUBEARMOR, INLINE</text>

    <rect x="30" y="214" width="212" height="52" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <text x="136" y="246" font-size="13" font-weight="600" fill="#14181C" text-anchor="middle">the call is made</text>

    <rect x="288" y="214" width="266" height="52" rx="5" fill="#FDF3ED" stroke="#B23A0B" stroke-width="2"/>
    <text x="421" y="246" font-size="13" font-weight="650" fill="#14181C" text-anchor="middle">the kernel checks the rule</text>

    <rect x="600" y="214" width="220" height="52" rx="5" fill="#FFFFFF" stroke="#C7D1CE" stroke-width="1.6"/>
    <g color="#B23A0B"><use href="#ic-lock" x="618" y="231"/></g>
    <text x="646" y="245" font-size="13" font-weight="600" fill="#14181C">Permission denied</text>

    <g color="#B23A0B" stroke="#B23A0B" stroke-width="2" fill="none">
      <line x1="242" y1="240" x2="288" y2="240" marker-end="url(#arw)"/>
      <line x1="554" y1="240" x2="600" y2="240" marker-end="url(#arw)"/>
    </g>

    <text x="846" y="245" font-size="13" font-weight="650" fill="#B23A0B" text-anchor="middle">nothing ran</text>
  </g>
</svg>
